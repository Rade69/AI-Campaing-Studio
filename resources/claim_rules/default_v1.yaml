prohibited_terms:
  - najbolji
  - vodeći
  - garantujemo
  - garantovano
  - garantovan
  - garantuje
  - garantujem
  - garantuju
  - garancija
  - "100%"
  - bez rizika
  - potpuno sigurno
  - najjeftiniji
  - jedini
  - certifikovan
currency_symbols: ["KM", "BAM", "EUR", "€", "RSD"]
contact_info_patterns:
  # Phone numbers in BHS formats: 065 123 456, 033/123-456, +387 61 123 456.
  # The optional country code allows a leading "+NNN ". At least ONE separator
  # (space, dash, dot, slash) between the first and second digit group is
  # REQUIRED, so a bare 8-10 digit run ("12345678") is NOT mistaken for a
  # phone number and still falls through to unsupported-number.
  - '(?:\+\d{1,3}[\s\-\.]?)?\d{2,3}[\s\-\./]\d{3}[\s\-\.]?\d{3,4}'
  # Street-address-like phrase: a street/address keyword followed (before any
  # sentence punctuation) by a number. Covers "Ulica Kralja Petra 15",
  # "adresa Ulica Primjera 12", "Bulevar Kralja Petra 5". ``\b`` word
  # boundaries keep the keywords from matching inside longer words
  # ("trg" != "trgovina"). Deliberately heuristic, not a full address parser;
  # deliberately EXCLUDES the word "broj"/"br." ("mjesto broj 1" is the
  # idiomatic "number one", not an address) and "put" (too ambiguous) —
  # see claim_linter._numeric_reason_code docstring.
  - '\b(?:ulica|adresa|avenija|bulevar|trg|sokak|bb)\b[^,.;!?]*\d+'
