[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-campaign-studio"
version = "0.1.0"
description = "Desktop-first, local-first AI application for structured marketing campaign creation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "platformdirs>=4.2",
    "keyring>=25.0",
    # First live provider adapter (A8, dio 2). Chosen over raw httpx for
    # its maintained auth/error/streaming surface; transport is injected in
    # tests so no real network call happens during CI. >=1.30 guarantees the
    # `response_format` json_schema structured-outputs API used here.
    "openai>=1.30",
    # Google (Gemini) live adapter (A8, dio 5). Unified Google Gen AI SDK,
    # the current canonical package for new code (the older
    # `google-generativeai` package is deprecated/EOL).
    "google-genai>=1.0",
    # A8 dio 4 (Anthropic/Claude). >=1.0 required because we use the
    # ``output_config`` parameter on ``messages.create`` for server-side
    # JSON-schema structured output (BF-1 fix runda: prompt-based JSON
    # alone was insufficient — DeepSeek had 7 stavki umjesto traženih 3
    # without enforced schema). ``output_config`` was added in the 1.0
    # line; raising the lower bound to 1.0 means we always have it and
    # can drop the prompt-injection fallback path entirely. 1.3.0
    # confirmed installed in the dev environment and exercised by the
    # test suite against real anthropic.types.Message / TextBlock / Usage
    # / ModelInfo instances.
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Both openai and anthropic SDK exception constructors require real
    # httpx.Request / httpx.Response instances to build fake fixtures
    # (see test_openai_adapter.py BF-1 fix and test_anthropic_adapter.py
    # BF-1-style guard for stop_reason / token mapping). httpx is therefore
    # a *test-only* dependency of the live-adapter test suite; we declare
    # it explicitly here so the dev environment is reproducible from a
    # fresh ``pip install -e ".[dev]"`` without accidentally relying on
    # the openai SDK's transitive httpx pin.
    "httpx>=0.27",
]

# ACS-F1-032: throwaway renderer spike candidates. NOT a runtime
# dependency of the production app -- these exist only to make
# ``spikes/renderer/`` runnable. A14 dio 2 (production renderer) will
# pin only the winner in [project.dependencies] after the spike
# decision is recorded in ``artifacts/renderer_spike_result.json``.
renderer-spike = ["playwright>=1.60"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

# ACS-F1-032: throwaway spike code lives under spikes/. It is NOT linted
# (the rendered HTML/SVG would otherwise generate hundreds of E501
# lines and the eval-loop Python is intentionally imperative).
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
