[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-campaign-studio"
version = "0.1.0"
description = "Desktop-first, local-first AI application for structured marketing campaign creation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "platformdirs>=4.2",
    "keyring>=25.0",
    # First live provider adapter (A8, dio 2). Chosen over raw httpx for
    # its maintained auth/error/streaming surface; transport is injected in
    # tests so no real network call happens during CI. >=1.30 guarantees the
    # `response_format` json_schema structured-outputs API used here.
    "openai>=1.30",
    # Google (Gemini) live adapter (A8, dio 5). Unified Google Gen AI SDK,
    # the current canonical package for new code (the older
    # `google-generativeai` package is deprecated/EOL).
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # test_openai_adapter.py builds fake openai SDK exception objects
    # (RateLimitError/APIConnectionError/AuthenticationError) whose
    # constructors require real httpx.Request/httpx.Response instances.
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
