[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-campaign-studio"
version = "0.1.0"
description = "Desktop-first, local-first AI application for structured marketing campaign creation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "platformdirs>=4.2",
    "keyring>=25.0",
    # First live provider adapter (A8, dio 2). Chosen over raw httpx for
    # its maintained auth/error/streaming surface; transport is injected in
    # tests so no real network call happens during CI. >=1.30 guarantees the
    # `response_format` json_schema structured-outputs API used here.
    "openai>=1.30",
    # Google (Gemini) live adapter (A8, dio 5). Unified Google Gen AI SDK,
    # the current canonical package for new code (the older
    # `google-generativeai` package is deprecated/EOL).
    "google-genai>=1.0",
    # A8 dio 4 (Anthropic/Claude). >=1.0 required because we use the
    # ``output_config`` parameter on ``messages.create`` for server-side
    # JSON-schema structured output (BF-1 fix runda: prompt-based JSON
    # alone was insufficient — DeepSeek had 7 stavki umjesto traženih 3
    # without enforced schema). ``output_config`` was added in the 1.0
    # line; raising the lower bound to 1.0 means we always have it and
    # can drop the prompt-injection fallback path entirely. 1.3.0
    # confirmed installed in the dev environment and exercised by the
    # test suite against real anthropic.types.Message / TextBlock / Usage
    # / ModelInfo instances.
    "anthropic>=1.0",
    # A14 dio 2 (ACS-F1-033): PillowRenderer is the production
    # RendererPort implementation (R-B winner from the renderer spike
    # in ACS-F1-032). Pillow >= 10.0 is required for ``Image.alpha_composite``
    # (used in the overlay tint path) and the ``size`` keyword on
    # ``ImageFont.truetype`` (used in the headline font selection).
    # 12.3.0 is the dev-environment version; the lower bound 10.0
    # covers any 2-year-old Pillow still in wide use.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Both openai and anthropic SDK exception constructors require real
    # httpx.Request / httpx.Response instances to build fake fixtures
    # (see test_openai_adapter.py BF-1 fix and test_anthropic_adapter.py
    # BF-1-style guard for stop_reason / token mapping). httpx is therefore
    # a *test-only* dependency of the live-adapter test suite; we declare
    # it explicitly here so the dev environment is reproducible from a
    # fresh ``pip install -e ".[dev]"`` without accidentally relying on
    # the openai SDK's transitive httpx pin.
    "httpx>=0.27",
]

# ACS-F1-032: throwaway renderer spike candidates. NOT a runtime
# dependency of the production app -- these exist only to make
# ``spikes/renderer/`` runnable. A14 dio 2 (production renderer) will
# pin only the winner in [project.dependencies] after the spike
# decision is recorded in ``artifacts/renderer_spike_result.json``.
renderer-spike = ["playwright>=1.60"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package source tree. Without this, the phase0 gate report's
# subprocess ``pytest -q`` invocation (which sets no env vars) cannot
# find ``ai_campaign_studio.*`` and fails every test with
# ``ModuleNotFoundError``. Local runs that set ``PYTHONPATH=src``
# work without it; CI and the gate subprocess rely on this.
pythonpath = ["src"]
# ACS-F1-033: switch to ``importlib`` mode so test modules in two
# different test paths that share a leaf name (e.g.
# ``tests/unit/infrastructure/rendering/`` and
# ``tests/integration/application/rendering/``) do not collide in
# ``sys.modules`` under their shared parent (``rendering``). With
# ``prepend`` (the default), pytest imports the FIRST one it sees
# and fails to collect the second one with ``ModuleNotFoundError``
# for the other's test file. ``importlib`` mode imports each test
# module by its fully-qualified path, so the two ``rendering``
# packages are kept distinct. This is also what the phase0 gate
# report's subprocess ``pytest -q`` invocation needs to be green
# -- the gate calls pytest with no CLI flags, so the config-level
# default is the only knob that reaches the subprocess.
# NOTE: pytest 8.x does NOT accept ``import_mode`` as an ini key, so
# we use ``addopts`` (which IS prepended to every invocation,
# including the gate's subprocess ``pytest -q``) instead.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py312"

# ACS-F1-032: throwaway spike code lives under spikes/. It is NOT linted
# (the rendered HTML/SVG would otherwise generate hundreds of E501
# lines and the eval-loop Python is intentionally imperative).
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
