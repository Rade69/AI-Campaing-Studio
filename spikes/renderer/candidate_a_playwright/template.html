<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>ACS-F1-032 R-A spike</title>
<style>
  /* R-A: HTML/CSS + Playwright headless chromium.
     Width 1080 x Height 1350 per plan section 45 (Slice-1 format).
     System font stack: Chromium's default, which already includes glyph
     coverage for the BHS characters we test (the fixture text is rendered
     with the default Noto/Roboto fallback chain on the dev box). */
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .canvas {
    width: 1080px;
    height: 1350px;
    box-sizing: border-box;
    padding: 80px 80px 96px 80px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 90% 10%, #e0f2fe 0%, transparent 40%),
      radial-gradient(circle at 10% 90%, #ecfccb 0%, transparent 40%),
      #ffffff;
  }
  .logo-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 64px;
  }
  .logo {
    width: 96px;
    height: 96px;
    background: #0f766e;
    color: #fff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
  }
  .brand {
    font-size: 28px;
    font-weight: 600;
  }
  .headline {
    font-size: 76px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 40px 0;
    /* No overflow:hidden -- we WANT text to flow naturally and the
       post-render measurement to detect the overflow honestly. */
  }
  .caption {
    font-size: 36px;
    line-height: 1.35;
    color: #334155;
    margin: 0 0 48px 0;
  }
  .cta {
    margin-top: auto;
    align-self: flex-start;
    background: #0f766e;
    color: #fff;
    font-size: 36px;
    font-weight: 700;
    padding: 28px 56px;
    border-radius: 18px;
  }
  .footer {
    margin-top: 24px;
    color: #64748b;
    font-size: 22px;
  }
</style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div class="logo-bar">
      <div class="logo" id="logo">BS</div>
      <div class="brand" id="brand">BrightSmile Dental</div>
    </div>

    <h1 class="headline" id="headline">{{HEADLINE}}</h1>
    <p class="caption" id="caption">{{CAPTION}}</p>

    <div class="cta" id="cta">Zakažite konsultaciju</div>
    <div class="footer" id="footer">Centar Sarajeva · Tim sa 12+ godina iskustva · Medicinski titanijum klase 4</div>
  </div>
</body>
</html>
