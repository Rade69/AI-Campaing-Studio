name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI-only data dir override. ``AppPaths`` reads ``data_dir_override``
      # from the explicit constructor argument; the inline Python step
      # below passes the value through so the health check never touches
      # the runner's user profile.
      AI_CAMPAIGN_STUDIO_CI_DATA_DIR: ${{ runner.temp }}/acs-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: pytest
        run: python -m pytest -q

      - name: Validate bundled resources
        run: python scripts/validate_resources.py

      - name: No-secret scan (tracked files)
        run: python scripts/check_no_secrets.py

      # Health check with a temp data dir. ``python -m ai_campaign_studio.main
      # --health-check`` builds the bootstrap with default settings, which
      # would otherwise use ``platformdirs.user_data_dir`` (the runner's
      # user profile on macOS / Linux / Windows). The inline snippet below
      # calls the same public ``create_bootstrap`` and ``run_health_check``
      # functions but threads a runner-local ``AppPaths(data_dir_override=
      # ...)`` through, so nothing in the real user profile is touched.
      # It also explicitly uses ``EnvironmentSecretStore`` semantics
      # (default in non-production environment) — no keyring, no GUI,
      # no network, no provider SDK.
      - name: Health check (CI temp data dir, no keyring/GUI)
        env:
          AI_CAMPAIGN_STUDIO_CI_DATA_DIR: ${{ runner.temp }}/acs-data
        run: |
          mkdir -p "${AI_CAMPAIGN_STUDIO_CI_DATA_DIR}"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from ai_campaign_studio.bootstrap import (
              create_bootstrap,
              run_health_check,
          )
          from ai_campaign_studio.config.paths import AppPaths

          data_dir = Path(os.environ["AI_CAMPAIGN_STUDIO_CI_DATA_DIR"])
          bootstrap = create_bootstrap(paths=AppPaths(data_dir_override=data_dir))
          try:
              result = run_health_check(bootstrap)
          finally:
              bootstrap.job_manager.shutdown(wait=False)
              bootstrap.database_connection.close()

          json.dump(result, sys.stdout, sort_keys=True)
          sys.stdout.write("\n")
          sys.exit(0 if result["status"] == "ok" else 1)
          PY
