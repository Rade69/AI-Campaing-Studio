name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: pytest
        run: python -m pytest -q

      - name: Validate bundled resources
        run: python scripts/validate_resources.py

      - name: No-secret scan (tracked files)
        run: python scripts/check_no_secrets.py

      # Health check. The GitHub Actions runner is a fresh, single-use VM,
      # so the default AppPaths (platformdirs.user_data_dir under $HOME) is
      # safe to write to here - no override needed. Uses the same public
      # --health-check entrypoint as local development, which already has
      # its own unit/integration test coverage (tests/integration/startup/
      # test_health_check.py), so this step never duplicates health logic.
      # Explicitly uses EnvironmentSecretStore semantics (default in
      # non-production environment) - no keyring, no GUI, no network, no
      # provider SDK.
      - name: Health check
        run: python -m ai_campaign_studio.main --health-check
